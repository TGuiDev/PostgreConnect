services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      METADATA_DATABASE_URL: postgres://postgreconnect:postgreconnect@metadata-db:5432/postgreconnect
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_KEYS: ${API_KEYS}
    depends_on:
      metadata-db:
        condition: service_healthy

  metadata-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgreconnect
      POSTGRES_PASSWORD: postgreconnect
      POSTGRES_DB: postgreconnect
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgreconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metadata-db-data:
